services:
  wb2api:
    build: .
    container_name: workbuddy2api
    restart: unless-stopped
    # 容器默认以 app 用户（uid 10001）运行。宿主机挂载目录属主不同会导致
    # 「写入 auths/*.json.tmp 失败 permission denied」，三种解法任选：
    #   1) 非 root · 让容器以你自己的 uid 运行（挂载目录本来就是你建的）：
    #      PUID=$(id -u) PGID=$(id -g) docker compose up -d
    #      或写进 .env 文件：PUID=1000 / PGID=1000
    #   2) sudo chown -R 10001:10001 ./auths ./data ./config.json
    #   3) user: "0:0" 以 root 运行（省事但容器逃逸面更大，自担）
    user: "${PUID:-10001}:${PGID:-10001}"
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "127.0.0.1:7863:7863"
    volumes:
      - ./auths:/app/auths
      - ./data:/app/data
      # 注意：宿主机必须先有 config.json（cp config.example.json config.json）。
      # 缺失时 Docker 会把挂载点创建成目录 → 容器启动失败（程序会自动生成配置，
      # 但前提是它能以文件形式写入 —— 挂载目录会挡住这条路径）。
      # 不挂 :ro：面板「配置」页需要写回此文件（保存后热生效）。
      - ./config.json:/app/config.json

  # 提示词净化代理：改写 ZCode 注入的 git 分支说明，避开上游 WAF 的
  # 提示词注入误判。ZCode 填的地址是 127.0.0.1:18791（见 provider_config.json）。
  zps:
    image: honlnk/zcode-prompt-sanitizer:v0.3.2
    container_name: zps-wb2api
    restart: unless-stopped
    command: ["--config", "/data/config.yaml", "--port", "18791"]
    environment:
      # 容器内必须绑 0.0.0.0，127.0.0.1 从宿主机连不进来。
      - ZPS_HOST=0.0.0.0
    ports:
      - "127.0.0.1:18791:18791"
    volumes:
      - ~/.zcode-prompt-sanitizer-wb2api/config.yaml:/data/config.yaml:ro
    # 走同一 compose 网络的内部 DNS 直连网关，比 host.docker.internal 更稳。
    # 但 config.yaml 里已写死 host.docker.internal（旧实例的配置），二选一：
    # 想改用服务名就把 config.yaml 的 upstream target 改成 http://wb2api:7863
    extra_hosts:
      - "host.docker.internal:host-gateway"
